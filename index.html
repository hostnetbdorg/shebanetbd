<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ভূমি সেবা পোর্টাল</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Hind Siliguri','Inter',sans-serif;
  -webkit-tap-highlight-color:transparent
}

:root{
  --primary:#0f7a56;
  --primary-dark:#0a5c40;
  --primary-light:#e6f5ee;
  --primary-glow:rgba(15,122,86,.18);
  --accent:#e89a1f;
  --accent-dark:#b57812;
  --danger:#d93b3b;
  --danger-dark:#b32a2a;
  --success:#18a558;
  --success-dark:#128345;
  --info:#2c6fd6;
  --info-dark:#1e51a0;
  --purple:#7048c9;
  --bg:#f4f7fa;
  --bg-2:#eef2f7;
  --text:#0d1b2a;
  --text-2:#334155;
  --muted:#6b7c93;
  --border:#dbe3ec;
  --border-2:#c9d5e1;
  --card:#fff;
  --shadow-xs:0 1px 2px rgba(15,23,42,.05);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 14px 40px rgba(15,23,42,.12)
}

html,body{
  overflow-x:hidden;
  width:100%
}

body{
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  font-size:15px;
  -webkit-font-smoothing:antialiased
}

button{
  cursor:pointer;
  font-family:inherit;
  border:none;
  outline:none;
  background:transparent;
  color:inherit
}

button:disabled{
  cursor:not-allowed;
  opacity:.6
}

input,select,textarea{
  font-family:inherit;
  font-size:14.5px;
  padding:12px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  width:100%;
  background:#fff;
  transition:.2s;
  outline:none;
  color:var(--text)
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-glow)
}

input:disabled,select:disabled,textarea:disabled{
  background:#f6f8fb;
  color:var(--muted)
}

label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
  color:var(--text-2);
  letter-spacing:.2px
}

.field{
  margin-bottom:14px
}

.btn{
  padding:11px 20px;
  border-radius:10px;
  font-size:14.5px;
  font-weight:600;
  transition:.18s;
  display:inline-flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  white-space:nowrap;
  cursor:pointer;
  letter-spacing:.2px
}

.btn:active{
  transform:scale(.98)
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  box-shadow:0 4px 12px var(--primary-glow)
}

.btn-primary:hover:not(:disabled){
  background:var(--primary-dark)
}

.btn-danger{
  background:var(--danger);
  color:#fff
}

.btn-danger:hover:not(:disabled){
  background:var(--danger-dark)
}

.btn-success{
  background:var(--success);
  color:#fff
}

.btn-success:hover:not(:disabled){
  background:var(--success-dark)
}

.btn-warn{
  background:var(--accent);
  color:#fff
}

.btn-warn:hover:not(:disabled){
  background:var(--accent-dark)
}

.btn-info{
  background:var(--info);
  color:#fff
}

.btn-info:hover:not(:disabled){
  background:var(--info-dark)
}

.btn-ghost{
  background:#fff;
  color:var(--primary);
  border:1.5px solid var(--primary)
}

.btn-ghost:hover:not(:disabled){
  background:var(--primary-light)
}

.btn-sm{
  padding:7px 12px;
  font-size:12.5px;
  border-radius:8px
}

.btn-block{
  width:100%
}

.btn-lg{
  padding:13px 24px;
  font-size:15px;
  border-radius:11px
}

.hidden{
  display:none!important
}

.spinner{
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* AUTH */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(160deg,#0f2b21 0%,#0a5c40 45%,#0f7a56 100%);
  position:relative;
  overflow:hidden
}

#authScreen::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(232,154,31,.12),transparent 45%),
    radial-gradient(circle at 85% 80%,rgba(44,111,214,.12),transparent 45%);
  pointer-events:none
}

.auth-box{
  background:#fff;
  width:100%;
  max-width:430px;
  border-radius:20px;
  padding:32px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.4);
  position:relative;
  z-index:2;
  animation:slideUp .45s cubic-bezier(.2,.8,.2,1)
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.auth-logo{
  text-align:center;
  margin-bottom:22px
}

.logo-circle{
  width:72px;
  height:72px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border-radius:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  box-shadow:0 10px 26px var(--primary-glow)
}

.logo-circle i{
  font-size:32px;
  color:#fff
}

.auth-logo h1{
  font-size:23px;
  color:var(--primary);
  font-weight:700;
  margin-bottom:4px
}

.auth-logo p{
  color:var(--muted);
  font-size:13px
}

.msg{
  padding:12px 14px;
  border-radius:10px;
  font-size:13.5px;
  margin-bottom:14px;
  display:none;
  border-left:3.5px solid
}

.msg.error{
  background:#fef2f2;
  color:#991b1b;
  border-color:#d93b3b;
  display:block
}

.msg.success{
  background:#f0fdf4;
  color:#166534;
  border-color:#18a558;
  display:block
}

.link{
  color:var(--primary);
  font-weight:600;
  text-decoration:none;
  cursor:pointer
}

/* APP */

#appScreen{
  display:none;
  min-height:100vh;
  flex-direction:column
}

#appScreen.active{
  display:flex
}

.topbar{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 14px rgba(10,92,64,.24)
}

.topbar .brand{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700;
  font-size:15px;
  min-width:0;
  flex:1
}

.brand-icon{
  width:36px;
  height:36px;
  background:rgba(255,255,255,.16);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  border:1px solid rgba(255,255,255,.2);
  flex-shrink:0
}

.topbar .brand span{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.back-btn{
  display:none;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:15px;
  padding:0;
  border-radius:10px;
  transition:.18s;
  width:36px;
  height:36px;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.2);
  flex-shrink:0
}

.back-btn.show{
  display:flex
}

.topbar .user-area{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0
}

.balance-chip{
  background:rgba(255,255,255,.15);
  padding:6px 12px;
  border-radius:18px;
  font-size:12.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid rgba(255,255,255,.22);
  white-space:nowrap
}

.icon-btn{
  background:rgba(255,255,255,.12);
  color:#fff;
  font-size:15px;
  padding:8px;
  border-radius:10px;
  transition:.18s;
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.14)
}

.icon-btn:hover{
  background:rgba(255,255,255,.24)
}

.notice-bar{
  background:linear-gradient(90deg,#fef3c7,#fde68a,#fef3c7);
  padding:8px 12px;
  overflow:hidden;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1.5px solid #e89a1f
}

.notice-label{
  background:var(--accent-dark);
  color:#fff;
  padding:3px 9px;
  border-radius:16px;
  font-size:10.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0
}

.notice-track{
  display:inline-block;
  animation:ticker 30s linear infinite;
  color:#78350f;
  font-weight:500;
  font-size:13px;
  padding-left:40%
}

@keyframes ticker{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

/* LAYOUT */

.layout{
  display:flex;
  flex:1;
  position:relative
}

.sidebar{
  width:280px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:12px 10px;
  height:calc(100vh - 114px);
  overflow-y:auto;
  position:sticky;
  top:114px;
  flex-shrink:0
}

.sidebar .section-label{
  font-size:10.5px;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px 12px 8px;
  letter-spacing:1.2px;
  font-weight:700
}

.menu-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:10px 11px;
  color:var(--text-2);
  font-weight:500;
  font-size:14px;
  cursor:pointer;
  transition:.15s;
  border-radius:11px;
  margin-bottom:2px;
  user-select:none
}

.menu-item:hover{
  background:var(--primary-light)
}

.menu-item.active{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  box-shadow:0 5px 14px var(--primary-glow)
}

.menu-item .ico{
  width:38px;
  height:38px;
  background:var(--primary-light);
  color:var(--primary);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  flex-shrink:0
}

.menu-item.active .ico{
  background:rgba(255,255,255,.22);
  color:#fff
}

.menu-item .label{
  display:flex;
  flex-direction:column;
  min-width:0;
  flex:1
}

.menu-item .name{
  font-weight:600;
  font-size:13.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.menu-item .price{
  font-size:11.5px;
  color:var(--primary);
  margin-top:1px;
  font-weight:700
}

.menu-item.active .price{
  color:rgba(255,255,255,.9)
}

.main-content{
  flex:1;
  padding:18px;
  max-width:calc(100% - 280px);
  min-width:0
}

/* PAGE */

.page-title{
  font-size:20px;
  font-weight:700;
  color:var(--text);
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:11px
}

.title-icon{
  width:42px;
  height:42px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 5px 14px var(--primary-glow);
  flex-shrink:0
}

/* HERO */

.hero-banner{
  background:linear-gradient(135deg,#0a5c40 0%,#0f7a56 100%);
  color:#fff;
  border-radius:16px;
  padding:22px 20px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 26px var(--primary-glow)
}

.hero-banner h2{
  font-size:18px;
  font-weight:700;
  margin-bottom:4px
}

.hero-banner p{
  font-size:13px;
  opacity:.9;
  margin-bottom:12px
}

.hero-stats{
  display:flex;
  gap:22px;
  flex-wrap:wrap;
  margin-top:12px
}

.hero-stat{
  display:flex;
  flex-direction:column
}

.hero-stat .num{
  font-size:20px;
  font-weight:700
}

.hero-stat .lbl{
  font-size:11px;
  opacity:.85
}

/* CARD */

.card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow-xs);
  border:1px solid var(--border);
  margin-bottom:14px
}

.card h2{
  font-size:16px;
  margin-bottom:14px;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:700
}

.card h2 i{
  color:var(--primary)
}

/* QUICK */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-bottom:14px
}

.quick-card{
  color:#fff;
  border-radius:14px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
  border:none;
  text-align:left;
  width:100%;
  display:block
}

.quick-card:hover{
  transform:translateY(-3px)
}

.qc-1{
  background:linear-gradient(135deg,#0f7a56,#0a5c40)
}

.qc-2{
  background:linear-gradient(135deg,#2c6fd6,#1e51a0)
}

/* SERVICE */

.service-notice{
  background:#fff7ed;
  border-left:3.5px solid var(--accent);
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:14px;
  font-size:13px;
  color:#78350f;
  display:flex;
  gap:9px
}

.price-badge{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;
  padding:10px 18px;
  border-radius:11px;
  font-weight:700;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px
}

.success-panel{
  text-align:center;
  padding:36px 20px
}

.success-panel .check-circle{
  width:74px;
  height:74px;
  background:linear-gradient(135deg,#18a558,#128345);
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px
}

.success-panel .check-circle i{
  font-size:34px;
  color:#fff
}

/* TABLE */

.tbl-wrap{
  overflow-x:auto;
  border-radius:11px;
  border:1px solid var(--border);
  -webkit-overflow-scrolling:touch
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  background:#fff;
  min-width:650px
}

th{
  background:#f6f8fb;
  color:var(--muted);
  text-align:left;
  padding:11px 12px;
  font-weight:700;
  font-size:11px;
  white-space:nowrap;
  border-bottom:1.5px solid var(--border)
}

td{
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
  color:var(--text-2);
  font-size:12.5px
}

tbody tr:last-child td{
  border-bottom:none
}

.badge{
  padding:3px 9px;
  border-radius:14px;
  font-size:10.5px;
  font-weight:700;
  display:inline-block
}

.badge-pending{background:#fef3c7;color:#92400e}
.badge-approved{background:#dcfce7;color:#166534}
.badge-delivered{background:#dbeafe;color:#1e51a0}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-active{background:#dcfce7;color:#166534}
.badge-inactive{background:#fee2e2;color:#991b1b}

/* PAYMENT */

.pay-methods{
  display:flex;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap
}

.pay-method{
  flex:1;
  min-width:120px;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:16px 12px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  background:#fff
}

.pay-method.selected{
  border-color:var(--primary);
  background:var(--primary-light)
}

.pay-method i{
  font-size:24px;
  margin-bottom:6px;
  color:var(--primary)
}

.pay-method span{
  display:block;
  font-weight:700
}

.pay-info{
  background:var(--primary-light);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  border:1.5px dashed rgba(15,122,86,.4)
}

/* MODAL */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(13,27,42,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:16px;
  backdrop-filter:blur(4px)
}

.modal-overlay.active{
  display:flex
}

.modal{
  background:#fff;
  border-radius:16px;
  padding:22px;
  max-width:620px;
  width:100%;
  max-height:94vh;
  overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.35)
}

.modal h3{
  color:var(--text);
  margin-bottom:14px;
  font-size:16.5px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:9px
}

.modal h3 i{
  color:var(--primary)
}

.modal-actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:18px;
  flex-wrap:wrap
}

/* WHATSAPP */

.wa-wrap{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:200;
  display:flex;
  flex-direction:column;
  gap:9px;
  align-items:flex-end
}

.wa-float{
  width:52px;
  height:52px;
  background:#25D366;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  box-shadow:0 8px 22px rgba(37,211,102,.5);
  text-decoration:none
}

.wa-group{
  background:#128C7E
}

/* ADMIN */

.admin-tabs{
  display:flex;
  gap:6px;
  margin-bottom:14px;
  overflow-x:auto;
  padding-bottom:3px
}

.admin-tabs button{
  padding:8px 14px;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:9px;
  font-weight:600;
  color:var(--text-2);
  white-space:nowrap;
  font-size:12.5px
}

.admin-tabs button.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary)
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field-builder-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:8px;
  margin-bottom:8px;
  background:#f6f8fb;
  padding:9px;
  border-radius:10px;
  align-items:center;
  border:1px solid var(--border)
}

.menu-toggle{
  display:none
}

.empty{
  text-align:center;
  padding:36px 18px;
  color:var(--muted)
}

.empty i{
  font-size:42px;
  margin-bottom:10px;
  opacity:.25;
  display:block
}

.role-chip{
  background:var(--purple);
  color:#fff;
  padding:3px 9px;
  border-radius:14px;
  font-size:10px;
  font-weight:700
}

.dash-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:11px;
  margin-bottom:14px
}

.stat-card{
  background:#fff;
  border-radius:13px;
  padding:14px;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow-xs)
}

.stat-card .ico{
  width:44px;
  height:44px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  color:#fff;
  flex-shrink:0
}

/* IMAGE */

.result-images{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  margin-top:10px
}

.result-images img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:10px;

  const last =
    pageHistory[pageHistory.length-1];

  if(
    last &&
    last.page === page &&
    last.extra === extra
  ) return;

  pageHistory.push({
    page,
    extra
  });

  if(pageHistory.length > 50)
    pageHistory.shift();

  updateBackBtn();

}


function updateBackBtn(){

  const btn = $("backBtn");

  if(!btn) return;

  if(pageHistory.length > 1)
    btn.classList.add("show");
  else
    btn.classList.remove("show");

}

  if(pageHistory.length <= 1){

  }

  pageHistory.pop();

  const prev =
    pageHistory[
      pageHistory.length - 1
    ];

  isGoingBack = true;

  navigate(
    prev.page,
    prev.extra
  );

  isGoingBack = false;

  updateBackBtn();

};

window.doRegister = async e => {

  e.preventDefault();

  if(settings.registrationEnabled === false){

    showAuthMsg(
      "বর্তমানে রেজিষ্ট্রেশন বন্ধ আছে। সাপোর্টে যোগাযোগ করুন।"
    );

    return;

  }

  const btn = $("regBtn");

  if(btn.disabled) return;

  const name =
    $("regName").value.trim();

  const phone =
    $("regPhone").value.trim();

  const pass =
    $("regPass").value;

  if(!/^01\d{9}$/.test(phone)){

    return showAuthMsg(
      "সঠিক ফোন নাম্বার দিন (01XXXXXXXXX)"
    );

  }

  if(pass.length < 6){

    return showAuthMsg(
      "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে"
    );

  }

  btnLoad(
    btn,
    true,
    "রেজিষ্ট্রেশন হচ্ছে..."
  );

  try{

    const q =
      query(
        collection(db,"users"),
        where("phone","==",phone)
      );

    const snap =
      await getDocs(q);

    if(!snap.empty){

      btnLoad(btn,false);

      return showAuthMsg(
        "এই ফোন নাম্বার দিয়ে ইতিমধ্যে রেজিষ্ট্রেশন করা আছে"
      );

    }

    const fakeEmail =
      phone + "@landbd.local";

    const cred =
      await createUserWithEmailAndPassword(
        auth,
        fakeEmail,
        pass
      );

    await setDoc(
      doc(db,"users",cred.user.uid),
      {
        uid:cred.user.uid,
        name,
        phone,
        balance:0,
        role:"user",
        status:"active",
        createdAt:serverTimestamp()
      }
    );

    await signOut(auth);

    showAuthMsg(
      "রেজিষ্ট্রেশন সফল! এখন লগইন করুন।",
      "success"
    );

    switchAuth("login");

    $("loginInput").value =
      phone;

    $("regName").value = "";
    $("regPhone").value = "";
    $("regPass").value = "";

  }catch(err){

    showAuthMsg(
      "রেজিষ্ট্রেশন ব্যর্থ: " +
      err.message
    );

  }finally{

    btnLoad(btn,false);

  }

};


/* =========================================================
   LOGIN
========================================================= */

window.doLogin = async e => {

  e.preventDefault();

  const btn = $("loginBtn");

  if(btn.disabled) return;

  const input =
    $("loginInput").value.trim();

  const pass =
    $("loginPass").value;

  if(!input || !pass)
    return showAuthMsg(
      "সব তথ্য দিন"
    );

  let email;

  if(input.includes("@")){

    email = input;

  }else{

    if(!/^01\d{9}$/.test(input))
      return showAuthMsg(
        "সঠিক ফোন নাম্বার অথবা ইমেইল দিন"
      );

    email =
      input + "@landbd.local";

  }

  btnLoad(
    btn,
    true,
    "লগইন হচ্ছে..."
  );

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      pass
    );

  }catch(err){

    showAuthMsg(
      "লগইন ব্যর্থ: তথ্য ভুল"
    );

  }finally{

    btnLoad(btn,false);

  }

};

/* =========================================================
   SEED
========================================================= */

async function seedDefaultServices(){

  try{

    const snap =
      await getDocs(
        collection(db,"services")
      );

    if(!snap.empty)
      return false;

    for(
      const service of DEFAULT_SERVICES
    ){

      await addDoc(
        collection(db,"services"),
        {
          ...service,
          enabled:true
        }
      );

    }

    return true;

  }catch(err){

    console.error(err);

    return false;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(unsubUser){
      unsubUser();
      unsubUser=null;
    }

    if(unsubSettings){
      unsubSettings();
      unsubSettings=null;
    }

    if(unsubServices){
      unsubServices();
      unsubServices=null;
    }

    if(!user){

      currentUser=null;

      pageHistory=[];

      $("authScreen")
        .style
        .display="flex";

      $("appScreen")
        .classList
        .remove("active");

      $("waFloat")
        .classList
        .add("hidden");

      $("waGroupFloat")
        .classList
        .add("hidden");

      updateBackBtn();

      return;

    }


    const uref =
      doc(db,"users",user.uid);

    let usnap =
      await getDoc(uref);


    if(!usnap.exists()){

      const isAdminEmail =
        user.email === ADMIN_EMAIL;

      const isSuperAdmin =
        user.uid === SUPERADMIN_UID;

      const role =
        isSuperAdmin
          ? "superadmin"
          : isAdminEmail
            ? "admin"
            : "user";

      const phone =
        user.email.includes("@landbd.local")
          ? user.email.split("@")[0]
          : user.email;

      await setDoc(
        uref,
        {
          uid:user.uid,
          name:isAdminEmail
            ? "Admin"
            : "User",
          phone,
          email:user.email || "",
          balance:0,
          role,
          status:"active",
          createdAt:serverTimestamp()
        }
      );

      usnap =
        await getDoc(uref);

    }


    const udata =
      usnap.data();


    if(
      udata.status === "blocked" ||
      udata.status === "removed"
    ){

      await signOut(auth);

      showAuthMsg(
        "আপনার একাউন্ট বর্তমানে সক্রিয় নয়"
      );

      return;

    }


    currentUser = {
      uid:user.uid,
      ...udata
    };


    const isAdminUser =
      currentUser.role === "admin" ||
      currentUser.role === "superadmin";


    if(isAdminUser){

      try{

        const snap =
          await getDocs(
            collection(db,"services")
          );

        if(snap.empty){

          await seedDefaultServices();

          toast(
            "সব ডিফল্ট সার্ভিস তৈরি হয়েছে"
          );

        }

      }catch(e){

        console.warn(e);

      }

    }


    /* USER LIVE */

    unsubUser =
      onSnapshot(
        uref,
        s => {

          if(!s.exists())
            return;

          const d =
            s.data();

          if(
            d.status === "blocked" ||
            d.status === "removed"
          ){

            logout();

            return;

          }

          currentUser.balance =
            d.balance || 0;

          currentUser.name =
            d.name || "";

          currentUser.phone =
            d.phone || "";

          currentUser.email =
            d.email || "";

          currentUser.role =
            user.uid === SUPERADMIN_UID
              ? "superadmin"
              : d.role || "user";

          $("topBalance")
            .textContent =
            fmt(currentUser.balance);

        }
      );


    /* SETTINGS LIVE */

    unsubSettings =
      onSnapshot(
        doc(db,"settings","site"),
        s => {

          settings =
            s.exists()
              ? s.data()
              : {};

          applySettings();

        }
      );


    /* SERVICES LIVE */

    unsubServices =
      onSnapshot(
        collection(db,"services"),
        s => {

          services=[];

          s.forEach(d => {

            services.push({
              id:d.id,
              ...d.data()
            });

          });

          services.sort(
            (a,b)=>
              (a.order || 0) -
              (b.order || 0)
          );

          renderSidebar();

          if(
            adminTab === "services" &&
            isAdminUser
          ){

            renderAdminTab();

          }

        }
      );


    $("authScreen")
      .style
      .display="none";

    $("appScreen")
      .classList
      .add("active");


    $("topBalance")
      .textContent =
      fmt(currentUser.balance || 0);


    $("balanceChip")
      .style
      .display =
      isAdminUser
        ? "none"
        : "flex";


    $("topBrandText")
      .textContent =
      isAdminUser
        ? "অ্যাডমিন প্যানেল"
        : "ভূমি সেবা পোর্টাল";


    pageHistory=[];


    if(isAdminUser){

      pushHistory("admin");

      navigate("admin");

    }else{

      pushHistory("home");

      navigate("home");

      setTimeout(
        showUserPopups,
        600
      );

    }

  }
);

/* =========================================================
   POPUP SETTINGS
========================================================= */

function getPopupArray(){

  const arr=[];

  for(let i=1;i<=3;i++){

    const p =
      settings["popup"+i];

    if(
      p &&
      p.enabled !== false &&
      p.image
    ){

      arr.push({
        slot:i,
        image:p.image,
        title:p.title || "",
        description:p.description || ""
      });

    }

  }

  return arr;

}


/* =========================================================
   SHOW USER POPUPS
========================================================= */

function showUserPopups(){

  if(
    currentUser?.role === "admin" ||
    currentUser?.role === "superadmin"
  )
    return;

  popupList =
    getPopupArray();

  popupIndex=0;

  if(!popupList.length)
    return;

  renderUserPopup();

}


function renderUserPopup(){

  if(!popupList.length){

    closeModal();

    return;

  }

  const p =
    popupList[popupIndex];

  const isLast =
    popupIndex ===
    popupList.length - 1;

  openModal(`

    <div style="text-align:center">

      ${
        p.image
          ? `
            <img
              class="popup-image"
              src="${esc(p.image)}"
              alt="Notice">
          `
          : ""
      }

      <div class="popup-dots">

        ${popupList.map((_,i)=>`
          <span
            class="popup-dot ${
              i===popupIndex
                ? "active"
                : ""
            }">
          </span>
        `).join("")}

      </div>

      ${
        p.title
          ? `
            <h3
              style="
                justify-content:center;
                margin-bottom:7px
              ">
              <i class="fa-solid fa-bullhorn"></i>
              ${esc(p.title)}
            </h3>
          `
          : ""
      }

      ${
        p.description
          ? `
            <p
              style="
                color:var(--muted);
                font-size:13px;
                margin-bottom:12px
              ">
              ${esc(p.description)}
            </p>
          `
          : ""
      }

      <div
        style="
          display:flex;
          gap:8px;
          justify-content:center;
          flex-wrap:wrap
        ">

        <button
          class="btn btn-ghost"
          onclick="closeModal()"
          type="button">
          <i class="fa-solid fa-xmark"></i>
          বন্ধ
        </button>

        ${
          !isLast
            ? `
              <button
                class="btn btn-primary"
                onclick="nextPopup()"
                type="button">
                পরবর্তী
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            `
            : `
              <button
                class="btn btn-primary"
                onclick="closeModal()"
                type="button">
                বুঝেছি
                <i class="fa-solid fa-check"></i>
              </button>
            `
        }

      </div>

    </div>

  `);

}


window.nextPopup = () => {

  if(
    popupIndex <
    popupList.length - 1
  ){

    popupIndex++;

    renderUserPopup();

  }

};

/* =========================================================
   NAVIGATION
========================================================= */

function highlightMenu(
  page,
  extra
){

  document
    .querySelectorAll(
      ".sidebar .menu-item"
    )
    .forEach(m=>{

      if(page === "service"){

        m.classList.toggle(
          "active",
          m.dataset.page ===
          "service-" + extra
        );

      }else{

        m.classList.toggle(
          "active",
          m.dataset.page === page
        );

      }

    });

}


function navigate(page,extra){

  const isAdmin =
    currentUser?.role === "admin" ||
    currentUser?.role === "superadmin";

  if(isAdmin && page !== "admin")
    page = "admin";

  if(!isAdmin && page === "admin")
    page = "home";


  highlightMenu(
    page,
    extra
  );


  const mc =
    $("mainContent");


  if(page === "home")
    renderHome(mc);

  else if(page === "recharge")
    renderRecharge(mc);

  else if(page === "orders")
    renderOrders(mc);

  else if(page === "profile")
    renderProfile(mc);

  else if(page === "admin")
    renderAdmin(mc);

  else if(page === "service")
    renderServiceForm(
      mc,
      extra
    );


  if(window.innerWidth <= 820){

    $("sidebar")
      .classList
      .remove("open");

    $("sbBackdrop")
      .classList
      .remove("active");

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


window.navTo = (
  page,
  extra
) => {

  const isAdmin =
    currentUser?.role === "admin" ||
    currentUser?.role === "superadmin";

  if(isAdmin){

    pageHistory = [
      {page:"admin"}
    ];

    updateBackBtn();

    navigate("admin");

    return;

  }


  if(!isGoingBack)
    pushHistory(
      page,
      extra
    );

  navigate(
    page,
    extra
  );

};


window.openService = id => {

  const s =
    services.find(
      x => x.id === id
    );

  if(!s)
    return toast(
      "সার্ভিস পাওয়া যায়নি",
      "error"
    );

  if(s.enabled === false)
    return toast(
      "এই সার্ভিসটি বর্তমানে বন্ধ",
      "error"
    );

  navTo(
    "service",
    id
  );

};

window.submitOrder =
async e => {

  e.preventDefault();

  const s =
    currentService;

  if(!s) return;

  const btn =
    $("orderSubmitBtn");

  if(btn?.disabled)
    return;


  if(
    (currentUser.balance || 0) <
    Number(s.price)
  ){

    return toast(
      "পর্যাপ্ত ব্যালেন্স নেই। রিচার্জ করুন।",
      "error"
    );

  }


  btnLoad(
    btn,
    true,
    "অর্ডার হচ্ছে..."
  );


  const fd =
    new FormData(e.target);

  const data = {};


  (s.fields || [])
    .forEach((f,i)=>{

      data[f.label] =
        fd.get("f_"+i) || "";

    });


  try{

    await runTransaction(
      db,
      async transaction => {

        const uref =
          doc(
            db,
            "users",
            currentUser.uid
          );

        const usnap =
          await transaction.get(uref);

        if(!usnap.exists())
          throw new Error(
            "ইউজার পাওয়া যায়নি"
          );


        const bal =
          usnap.data().balance || 0;


        if(
          bal < Number(s.price)
        )
          throw new Error(
            "পর্যাপ্ত ব্যালেন্স নেই"
          );


        const oref =
          doc(
            collection(
              db,
              "orders"
            )
          );


        transaction.set(
          oref,
          {
            userId:currentUser.uid,
            userName:currentUser.name,
            userPhone:currentUser.phone,
            serviceId:s.id,
            serviceName:s.name,
            price:Number(s.price),
            data,
            status:"pending",
            resultText:"",
            resultImages:[],
            createdAt:serverTimestamp()
          }
        );


        transaction.update(
          uref,
          {
            balance:
              bal - Number(s.price)
          }
        );

      }
    );


    toast(
      "অর্ডার সফলভাবে সাবমিট হয়েছে!"
    );


    $("mainContent").innerHTML = `

      <div class="card success-panel">

        <div class="check-circle">
          <i class="fa-solid fa-check"></i>
        </div>

        <h3
          style="
            color:var(--success);
            margin-bottom:6px
          ">
          অর্ডার সফলভাবে জমা হয়েছে
        </h3>

        <p>
          আপনার অর্ডারটি পর্যালোচনার জন্য পাঠানো হয়েছে।
          অ্যাডমিন ফলাফল পাঠালে Order History-তে দেখতে পারবেন।
        </p>

        <button
          class="btn btn-primary"
          onclick="navTo('orders')"
          type="button">

          <i class="fa-solid fa-list"></i>
          অর্ডার হিস্টোরি

        </button>

      </div>

    `;


  }catch(err){

    toast(
      "সমস্যা: " +
      (err.message || err),
      "error"
    );

    btnLoad(
      btn,
      false
    );

  }

};

async function loadOrders(tab){

  const box =
    $("orderContent");

  if(!box) return;


  box.innerHTML =
    `<div class="empty">
      <i class="fa-solid fa-spinner fa-spin"></i>
      লোড হচ্ছে...

  try{

    const q =
      query(
        collection(db,tab),
        where(
          "userId",
          "==",
          currentUser.uid
        )
      );


    const snap =
      await getDocs(q);

    const list=[];


    snap.forEach(d=>{

      list.push({
        id:d.id,
        ...d.data()
      });

    });


    list.sort(
      (a,b)=>
        (b.createdAt?.seconds || 0) -
        (a.createdAt?.seconds || 0)
    );


    if(!list.length){

      box.innerHTML =
        `<div class="empty">
          <i class="fa-solid fa-inbox"></i>
          কোন রেকর্ড নেই

window.saveService =
async (e,id) => {

  e.preventDefault();

  const btn =
    $("serviceSaveBtn");

  if(btn?.disabled)
    return;


  btnLoad(
    btn,
    true,
    "সেভ হচ্ছে..."
  );


  const fields=[];


  document
    .querySelectorAll(
      "#fieldsBox > div"
    )
    .forEach(d=>{

      const label =
        d.querySelector(
          ".fld-label"
        ).value.trim();

      if(!label)
        return;


      fields.push({

        label,

        name:
          label
            .toLowerCase()
            .replace(/\s+/g,"_"),

        type:
          d.querySelector(
            ".fld-type"
          ).value,

        required:
          d.querySelector(
            ".fld-req"
          ).value === "1"

      });

    });


  const data={

    name:
      $("svName")
        .value
        .trim(),

    price:
      Number(
        $("svPrice").value
      ) || 0,

    icon:
      $("svIcon")
        .value
        .trim() ||
      "file-lines",

    notice:
      $("svNotice")
        .value
        .trim(),

    order:
      Number(
        $("svOrder").value
      ) || 0,

    fields

  };


  try{

    if(id){

      await updateDoc(
        doc(
          db,
          "services",
          id
        ),
        data
      );

    }else{

      await addDoc(
        collection(
          db,
          "services"
        ),
        {
          ...data,
          enabled:true
        }
      );

    }


    toast(
      "সার্ভিস সেভ হয়েছে"
    );

    closeModal();


  }catch(err){

    toast(
      err.message,
      "error"
    );

    btnLoad(
      btn,
      false
    );

  }

};

window.approveRecharge =
async (
  rid,
  uid,
  amt,
  btn
) => {

  if(btn?.disabled)
    return;

  if(btn){

    btn.disabled=true;

    btn.innerHTML =
      '<span class="spinner"></span>';

  }


  try{

    await runTransaction(
      db,
      async transaction => {

        const uref =
          doc(
            db,
            "users",
            uid
          );

        const rref =
          doc(
            db,
            "recharges",
            rid
          );


        const usnap =
          await transaction.get(uref);

        const rsnap =
          await transaction.get(rref);


        if(!usnap.exists())
          throw new Error(
            "ইউজার পাওয়া যায়নি"
          );


        if(
          rsnap.exists() &&
          rsnap.data().status !== "pending"
        )
          throw new Error(
            "ইতিমধ্যে প্রসেস হয়েছে"
          );


        const bal =
          usnap.data().balance || 0;


        transaction.update(
          uref,
          {
            balance:
              bal + Number(amt)
          }
        );


        transaction.update(
          rref,
          {
            status:"approved",
            approvedAt:
              serverTimestamp()
          }
        );

      }
    );


    toast(
      "রিচার্জ অনুমোদিত"
    );

    renderAdminTab();


  }catch(err){

    toast(
      err.message,
      "error"
    );

    if(btn){

      btn.disabled=false;

      btn.innerHTML =
        '<i class="fa-solid fa-check"></i>';

    }

  }

};

async (

    );

/* =========================================================
   REJECT ORDER + REFUND
========================================================= */

window.rejectOrder =
async (
  id,
  btn
) => {

  if(btn?.disabled)
    return;


  if(btn){

    btn.disabled=true;

    btn.innerHTML =
      '<span class="spinner"></span>';

  }


  try{

    await runTransaction(
      db,
      async transaction => {

        const oref =
          doc(
            db,
            "orders",
            id
          );


        const osnap =
          await transaction.get(oref);


        if(!osnap.exists())
          throw new Error(
            "অর্ডার পাওয়া যায়নি"
          );


        const d =
          osnap.data();


        if(d.status !== "pending")
          throw new Error(
            "ইতিমধ্যে প্রসেস হয়েছে"
          );


        if(
          d.userId &&
          d.price
        ){

          const uref =
            doc(
              db,
              "users",
              d.userId
            );


          const usnap =
            await transaction.get(
              uref
            );


          if(usnap.exists()){

            const bal =
              usnap.data()
                .balance || 0;


            transaction.update(
              uref,
              {
                balance:
                  bal +
                  Number(d.price)
              }
            );

          }

        }


        transaction.update(
          oref,
          {
            status:"rejected",
            rejectedAt:
              serverTimestamp()
          }
        );

      }
    );


    toast(
      "বাতিল ও রিফান্ড সম্পন্ন"
    );

    renderAdminTab();


  }catch(err){

    toast(
      err.message,
      "error"
    );

    if(btn){

      btn.disabled=false;

      btn.innerHTML =
        '<i class="fa-solid fa-xmark"></i>';

    }

  }

};

/* =========================================================
   SAVE DELIVERY
========================================================= */

window.saveOrderDelivery =
async (
  e,
  orderId
) => {

  e.preventDefault();


  const btn =
    $("deliveryBtn");

  if(btn?.disabled)
    return;


  const text =
    $("resultText")
      .value
      .trim();


  const imageUrls =
    ($("resultImageUrl")?.value || "")
      .split(/\r?\n|,/)
      .map(v => v.trim())
      .filter(Boolean);


  if(!text && !imageUrls.length){

    return toast(
      "ফলাফল লিখুন অথবা ছবির লিংক দিন",
      "error"
    );

  }


  for(const imageUrl of imageUrls){

    try{
      const u = new URL(imageUrl);
      if(!["http:","https:"].includes(u.protocol))
        throw new Error();
    }catch(err){
      return toast(
        "সঠিক Image URL দিন: " + imageUrl,
        "error"
      );
    }

  }


  btnLoad(
    btn,
    true,
    "পাঠানো হচ্ছে..."
  );


  try{

    const oldSnap =
      await getDoc(
        doc(
          db,
          "orders",
          orderId
        )
      );


    if(!oldSnap.exists())
      throw new Error(
        "অর্ডার পাওয়া যায়নি"
      );


    const oldData =
      oldSnap.data();


    const oldImages =
      oldData.resultImages || [];


    const newImages = [
      ...oldImages,
      ...imageUrls.filter(
        url => !oldImages.includes(url)
      )
    ];


    await updateDoc(
      doc(
        db,
        "orders",
        orderId
      ),
      {
        status:"delivered",

        resultText:text,

        resultImages:newImages,

        deliveredAt:
          serverTimestamp()
      }
    );


    toast(
      "ফলাফল সফলভাবে ইউজারকে পাঠানো হয়েছে"
    );


    closeModal();

    renderAdminTab();


  }catch(err){

    console.error(err);

    toast(
      "ডেলিভারি ব্যর্থ: " +
      (err.message || err),
      "error"
    );

    btnLoad(
      btn,
      false
    );

  }

};

/* =========================================================
   CREATE USER WITH SECONDARY AUTH
========================================================= */

window.createUserFromAdmin =
async e => {

  e.preventDefault();


  const btn =
    $("createUserBtn");

  if(btn?.disabled)
    return;


  const name =
    $("newUserName")
      .value
      .trim();

  const phone =
    $("newUserPhone")
      .value
      .trim();

  const emailInput =
    $("newUserEmail")
      .value
      .trim();

  const password =
    $("newUserPass")
      .value;

  const balance =
    Number(
      $("newUserBalance")
        .value
    ) || 0;


  if(
    !emailInput &&
    !/^01\d{9}$/.test(phone)
  ){

    return toast(
      "ফোন নাম্বার সঠিক দিন অথবা ইমেইল দিন",
      "error"
    );

  }


  if(password.length < 6){

    return toast(
      "পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে",
      "error"
    );

  }


  btnLoad(
    btn,
    true,
    "User তৈরি হচ্ছে..."
  );


  let secondaryApp = null;


  try{

    secondaryApp =
      initializeApp(
        firebaseConfig,
        "adminCreate_" +
        Date.now()
      );


    const secondaryAuth =
      getAuth(
        secondaryApp
      );


    const email =
      emailInput ||
      (
        phone +
        "@landbd.local"
      );


    const cred =
      await createUserWithEmailAndPassword(
        secondaryAuth,
        email,
        password
      );


    await setDoc(
      doc(
        db,
        "users",
        cred.user.uid
      ),
      {
        uid:cred.user.uid,
        name,
        phone:
          phone ||
          email,
        email,
        balance,
        role:"user",
        status:"active",
        createdAt:
          serverTimestamp(),
        createdBy:
          currentUser.uid
      }
    );


    await signOut(
      secondaryAuth
    );


    await deleteApp(
      secondaryApp
    );

    secondaryApp=null;


    toast(
      "নতুন User সফলভাবে তৈরি হয়েছে"
    );


    closeModal();

    renderAdminTab();


  }catch(err){

    console.error(err);

    toast(
      "User তৈরি ব্যর্থ: " +
      err.message,
      "error"
    );


    if(secondaryApp){

      try{
        await deleteApp(
          secondaryApp
        );
      }catch(_){}

    }


    btnLoad(
      btn,
      false
    );

  }

};

      doc(
        db,
        "users",
        uid
      ),
      {
        status:"removed"
      }
    );


    toast(
      "ইউজার রিমুভড"
    );

    renderAdminTab();


  }catch(err){

    toast(
      err.message,
      "error"
    );

    if(btn)
      btn.disabled=false;

  }

};


/* =========================================================
   REACTIVATE USER
========================================================= */

window.reactivateUser =
async (
  uid,
  btn
) => {

  if(btn?.disabled)
    return;


  if(!confirm(
    "এই User আবার চালু করবেন?"
  ))
    return;


  if(btn)
    btn.disabled=true;


  try{

    await updateDoc(
      doc(
        db,
        "users",
        uid
      ),
      {
        status:"active",
        reactivatedAt:
          serverTimestamp()
      }
    );


    toast(
      "User আবার সক্রিয় হয়েছে"
    );

    renderAdminTab();


  }catch(err){

    toast(
      err.message,
      "error"
    );

    if(btn)
      btn.disabled=false;

  }

};


/* =========================================================
   ADMIN PASSWORD RESET
========================================================= */

window.adminResetUser =
async uid => {

  const snap =
    await getDoc(
      doc(
        db,
        "users",
        uid
      )
    );


  if(!snap.exists()){

    return toast(
      "User পাওয়া যায়নি",
      "error"
    );

  }


  const u =
    snap.data();


  const email =
    u.email ||
    (
      u.phone &&
      u.phone.includes("@")
        ? u.phone
        : ""
    );


  if(!email){

    openModal(`

      <h3>

        <i class="fa-solid fa-key"></i>

        Password Reset

      </h3>


      <div class="notice-box">

        এই User ফোন দিয়ে তৈরি হয়েছে।

        <br><br>

        Firebase-এর নিরাপদ নিয়ম অনুযায়ী
        শুধু HTML/Browser থেকে Admin অন্য User-এর
        বর্তমান Password সরাসরি পরিবর্তন করতে পারে না।

        <br><br>

        এই ধরনের User-এর Password পরিবর্তনের জন্য
        Firebase Admin SDK / Cloud Function লাগবে।

      </div>


      <div class="modal-actions">

        <button
          class="btn btn-primary"
          onclick="closeModal()"
          type="button">

          বন্ধ

        </button>

      </div>

    `);

    return;

  }


  if(!confirm(
    "এই User-এর ইমেইলে Password Reset Link পাঠাবেন?"
  ))
    return;


  try{

    await sendPasswordResetEmail(
      auth,
      email
    );


    toast(
      "Password Reset Link পাঠানো হয়েছে"
    );

  }catch(err){

    toast(
      "Reset Link পাঠানো যায়নি: " +
      err.message,
      "error"
    );

  }

};

/* =========================================================

========================================================= */

window.savePopups =
async () => {

  const allData={};

  try{

    for(
      let i=1;
      i<=3;
      i++
    ){

      let image =
        $(`popup${i}Url`)
          .value
          .trim();


      allData[
        "popup" + i
      ] = {

        enabled:
          $(`popup${i}Enabled`)
            .checked,

        image,

        title:
          $(`popup${i}Title`)
            .value
            .trim(),

        description:
          $(`popup${i}Desc`)
            .value
            .trim()

      };

    }


    await setDoc(
      doc(
        db,
        "settings",
        "site"
      ),
      allData,
      {
        merge:true
      }
    );


    toast(
      "Popup Settings সফলভাবে সেভ হয়েছে"
    );


    renderAdminSettings(
      $("adminContent")
    );


  }catch(err){

    console.error(err);

    toast(
      "Popup Save ব্যর্থ: " +
      err.message,
      "error"
    );

  }

};


/* =========================================================
   SAVE GENERAL SETTINGS
========================================================= */

window.saveSettings =
async e => {

  e.preventDefault();

  const btn =
    $("settingsBtn");

  if(btn?.disabled)
    return;


  btnLoad(
    btn,
    true,
    "সেভ হচ্ছে..."
  );


  const data={

    mainNotice:
      $("setNotice")
        .value
        .trim(),

    bkashNumber:
      $("setBk")
        .value
        .trim(),

    bkashType:
      $("setBkType")
        .value
        .trim(),

    nagadNumber:
      $("setNg")
        .value
        .trim(),

    nagadType:
      $("setNgType")
        .value
        .trim(),

    whatsapp:
      $("setWa")
        .value
        .trim(),

    groupLink:
      $("setGrp")
        .value
        .trim(),

    registrationEnabled:
      $("setRegistration")
        .value === "on"

  };


  try{

    await setDoc(
      doc(
        db,
        "settings",
        "site"
      ),
      data,
      {
        merge:true
      }
    );


    toast(
      "সেটিংস সেভ হয়েছে"
    );


  }catch(err){

    toast(
      err.message,
      "error"
    );

  }finally{

    btnLoad(
      btn,
      false
    );

  }

};
