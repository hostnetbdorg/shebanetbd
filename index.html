<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ভূমি সেবা পোর্টাল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri','Inter',sans-serif;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#0f7a56;--primary-dark:#0a5c40;--primary-light:#e6f5ee;--primary-glow:rgba(15,122,86,.18);
  --accent:#e89a1f;--accent-dark:#b57812;
  --danger:#d93b3b;--danger-dark:#b32a2a;
  --success:#18a558;--success-dark:#128345;
  --info:#2c6fd6;--info-dark:#1e51a0;
  --purple:#7048c9;
  --bg:#f4f7fa;--bg-2:#eef2f7;
  --text:#0d1b2a;--text-2:#334155;--muted:#6b7c93;
  --border:#dbe3ec;--border-2:#c9d5e1;
  --card:#ffffff;
  --shadow-xs:0 1px 2px rgba(15,23,42,.05);
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 6px 20px rgba(15,23,42,.08);
  --shadow-lg:0 14px 40px rgba(15,23,42,.12);
}
html,body{overflow-x:hidden;width:100%}
body{background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;font-size:15px;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;border:none;outline:none;background:transparent;color:inherit}
button:disabled{cursor:not-allowed;opacity:.6}
input,select,textarea{font-family:inherit;font-size:14.5px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;width:100%;background:#fff;transition:.2s;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
input:disabled,select:disabled,textarea:disabled{background:#f6f8fb;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-2);letter-spacing:.2px}
.field{margin-bottom:14px}
.btn{padding:11px 20px;border-radius:10px;font-size:14.5px;font-weight:600;transition:.18s;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;cursor:pointer;letter-spacing:.2px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px var(--primary-glow)}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover:not(:disabled){background:var(--success-dark)}
.btn-warn{background:var(--accent);color:#fff}
.btn-warn:hover:not(:disabled){background:var(--accent-dark)}
.btn-info{background:var(--info);color:#fff}
.btn-info:hover:not(:disabled){background:var(--info-dark)}
.btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost:hover:not(:disabled){background:var(--primary-light)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn-lg{padding:13px 24px;font-size:15px;border-radius:11px}
.hidden{display:none!important}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ AUTH ============ */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0f2b21 0%,#0a5c40 45%,#0f7a56 100%);position:relative;overflow:hidden}
#authScreen::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(232,154,31,.12),transparent 45%),radial-gradient(circle at 85% 80%,rgba(44,111,214,.12),transparent 45%);pointer-events:none}
.auth-box{background:#fff;width:100%;max-width:430px;border-radius:20px;padding:32px 26px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative;z-index:2;animation:slideUp .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{text-align:center;margin-bottom:22px}
.auth-logo .logo-circle{width:72px;height:72px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:20px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 10px 26px var(--primary-glow);position:relative}
.auth-logo .logo-circle::before{content:'';position:absolute;inset:-4px;border-radius:24px;border:2px solid rgba(15,122,86,.1)}
.auth-logo .logo-circle i{font-size:32px;color:#fff}
.auth-logo h1{font-size:23px;color:var(--primary);font-weight:700;margin-bottom:4px;letter-spacing:-.3px}
.auth-logo p{color:var(--muted);font-size:13px}
.msg{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;display:none;border-left:3.5px solid}
.msg.error{background:#fef2f2;color:#991b1b;border-color:#d93b3b;display:block}
.msg.success{background:#f0fdf4;color:#166534;border-color:#18a558;display:block}
.link{color:var(--primary);font-weight:600;text-decoration:none;cursor:pointer}

/* ============ APP ============ */
#appScreen{display:none;min-height:100vh;flex-direction:column}
#appScreen.active{display:flex}
.topbar{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 14px rgba(10,92,64,.24)}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;min-width:0;flex:1}
.topbar .brand .brand-icon{width:36px;height:36px;background:rgba(255,255,255,.16);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,.2);flex-shrink:0}
.topbar .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Back বাটন */
.back-btn{display:none;background:rgba(255,255,255,.15);color:#fff;font-size:15px;padding:0;border-radius:10px;transition:.18s;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);flex-shrink:0}
.back-btn.show{display:flex}
.back-btn:hover{background:rgba(255,255,255,.28)}

.topbar .user-area{display:flex;align-items:center;gap:7px;flex-shrink:0}
.balance-chip{background:rgba(255,255,255,.15);padding:6px 12px;border-radius:18px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.22);white-space:nowrap}
.icon-btn{background:rgba(255,255,255,.12);color:#fff;font-size:15px;padding:8px;border-radius:10px;transition:.18s;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14)}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.notice-bar{background:linear-gradient(90deg,#fef3c7,#fde68a,#fef3c7);padding:8px 12px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:10px;border-bottom:1.5px solid #e89a1f}
.notice-bar .notice-label{background:var(--accent-dark);color:#fff;padding:3px 9px;border-radius:16px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;flex-shrink:0;letter-spacing:.3px}
.notice-track{display:inline-block;animation:ticker 30s linear infinite;color:#78350f;font-weight:500;font-size:13px;padding-left:40%}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* ============ LAYOUT ============ */
.layout{display:flex;flex:1;position:relative}
.sidebar{width:280px;background:#fff;border-right:1px solid var(--border);padding:12px 10px;height:calc(100vh - 114px);overflow-y:auto;position:sticky;top:114px;flex-shrink:0}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px}
.sidebar .section-label{font-size:10.5px;text-transform:uppercase;color:var(--muted);padding:12px 12px 8px;letter-spacing:1.2px;font-weight:700}
.sidebar .section-label:first-child{padding-top:6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:10px 11px;color:var(--text-2);font-weight:500;font-size:14px;cursor:pointer;transition:.15s;border-radius:11px;margin-bottom:2px;user-select:none;position:relative}
.menu-item:hover{background:var(--primary-light)}
.menu-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 5px 14px var(--primary-glow)}
.menu-item .ico{width:38px;height:38px;background:var(--primary-light);color:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:.18s;border:1px solid rgba(15,122,86,.06)}
.menu-item:hover .ico{transform:scale(1.05)}
.menu-item.active .ico{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.18)}
.menu-item .label{display:flex;flex-direction:column;min-width:0;flex:1}
.menu-item .label .name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit;letter-spacing:.1px}
.menu-item .label .price{font-size:11.5px;color:var(--primary);margin-top:1px;font-weight:700}
.menu-item.active .label .price{color:rgba(255,255,255,.9)}
.main-content{flex:1;padding:18px;max-width:calc(100% - 280px);min-width:0}

/* ============ PAGE ============ */
.page-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:11px;letter-spacing:-.2px}
.page-title .title-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 5px 14px var(--primary-glow);flex-shrink:0}

/* ============ HERO ============ */
.hero-banner{background:linear-gradient(135deg,#0a5c40 0%,#0f7a56 100%);color:#fff;border-radius:16px;padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 10px 26px var(--primary-glow)}
.hero-banner::before{content:'';position:absolute;top:-50%;right:-8%;width:250px;height:250px;background:radial-gradient(circle,rgba(232,154,31,.28),transparent 65%);border-radius:50%}
.hero-banner::after{content:'';position:absolute;bottom:-60%;left:-8%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);border-radius:50%}
.hero-banner .hero-content{position:relative;z-index:2}
.hero-banner h2{font-size:18px;font-weight:700;margin-bottom:4px;letter-spacing:-.2px}
.hero-banner p{font-size:13px;opacity:.9;margin-bottom:12px}
.hero-banner .hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.hero-banner .hero-stat{display:flex;flex-direction:column}
.hero-banner .hero-stat .num{font-size:20px;font-weight:700;letter-spacing:-.3px}
.hero-banner .hero-stat .lbl{font-size:11px;opacity:.85;letter-spacing:.3px}

/* ============ CARD ============ */
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow-xs);border:1px solid var(--border);margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:14px;color:var(--text);display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.1px}
.card h2 i{color:var(--primary);font-size:14.5px}

/* ============ QUICK ============ */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.quick-card{color:#fff;border-radius:14px;padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.12);border:none;text-align:left;width:100%;display:block}
.quick-card::after{content:'';position:absolute;top:-30%;right:-20%;width:130px;height:130px;background:rgba(255,255,255,.09);border-radius:50%}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.quick-card i{font-size:24px;margin-bottom:9px;position:relative;z-index:1;opacity:.95}
.quick-card h3{font-size:14.5px;margin-bottom:3px;position:relative;z-index:1;font-weight:700;color:#fff}
.quick-card p{font-size:12px;opacity:.9;position:relative;z-index:1;color:#fff}
.qc-1{background:linear-gradient(135deg,#0f7a56,#0a5c40)}
.qc-2{background:linear-gradient(135deg,#2c6fd6,#1e51a0)}

/* ============ SERVICE FORM ============ */
.service-notice{background:#fff7ed;border-left:3.5px solid var(--accent);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;color:#78350f;display:flex;gap:9px;align-items:flex-start}
.service-notice i{color:var(--accent-dark);margin-top:3px;font-size:14px;flex-shrink:0}
.price-badge{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:10px 18px;border-radius:11px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;box-shadow:0 5px 14px var(--primary-glow);letter-spacing:.2px}
.success-panel{text-align:center;padding:36px 20px}
.success-panel .check-circle{width:74px;height:74px;background:linear-gradient(135deg,#18a558,#128345);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 10px 26px rgba(24,165,88,.32)}
.success-panel .check-circle i{font-size:34px;color:#fff}
.success-panel h3{color:var(--success);margin-bottom:6px;font-size:18px;font-weight:700}
.success-panel p{color:var(--muted);margin-bottom:18px;font-size:13.5px}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--border);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;min-width:480px}
th{background:#f6f8fb;color:var(--muted);text-align:left;padding:11px 12px;font-weight:700;font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.6px;border-bottom:1.5px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-2);font-size:12.5px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.badge{padding:3px 9px;border-radius:14px;font-size:10.5px;font-weight:700;display:inline-block;letter-spacing:.2px}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-approved{background:#dcfce7;color:#166534}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-active{background:#dcfce7;color:#166534}
.badge-inactive{background:#fee2e2;color:#991b1b}

/* ============ PAY ============ */
.pay-methods{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pay-method{flex:1;min-width:120px;border:1.5px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;background:#fff;color:var(--text-2)}
.pay-method:hover{border-color:var(--primary)}
.pay-method.selected{border-color:var(--primary);background:var(--primary-light);box-shadow:0 4px 14px var(--primary-glow)}
.pay-method i{font-size:24px;margin-bottom:6px;color:var(--primary)}
.pay-method span{display:block;font-weight:700;font-size:14px;color:inherit}
.pay-info{background:var(--primary-light);border-radius:12px;padding:16px;margin-bottom:14px;border:1.5px dashed rgba(15,122,86,.4)}
.pay-info p{font-size:13px;margin-bottom:6px;color:var(--text-2)}
.pay-info strong{color:var(--primary);font-size:15.5px;letter-spacing:.4px;font-weight:700}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(13,27,42,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(3px)}
.modal-overlay.active{display:flex;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:slideUp .25s}
.modal h3{color:var(--text);margin-bottom:14px;font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:9px}
.modal h3 i{color:var(--primary)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ============ WHATSAPP ============ */
.wa-float{position:fixed;bottom:18px;right:18px;width:54px;height:54px;background:#25D366;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 22px rgba(37,211,102,.5);z-index:200;transition:.2s;text-decoration:none}
.wa-float:hover{transform:scale(1.08)}

/* ============ ADMIN ============ */
.admin-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.admin-tabs::-webkit-scrollbar{height:5px}
.admin-tabs::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:10px}
.admin-tabs button{padding:8px 14px;background:#fff;border:1.5px solid var(--border);border-radius:9px;font-weight:600;color:var(--text-2);white-space:nowrap;font-size:12.5px;transition:.2s;display:flex;align-items:center;gap:6px}
.admin-tabs button:hover{border-color:var(--primary);color:var(--primary)}
.admin-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 12px var(--primary-glow)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-builder-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;background:#f6f8fb;padding:9px;border-radius:10px;align-items:center;border:1px solid var(--border)}
.menu-toggle{display:none}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty i{font-size:42px;margin-bottom:10px;opacity:.25;display:block}
.role-chip{background:var(--purple);color:#fff;padding:3px 9px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:.4px}

/* ============ STATS ============ */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:14px}
.stat-card{background:#fff;border-radius:13px;padding:14px;border:1px solid var(--border);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-xs);transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.stat-card .ico{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.stat-card .info h4{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:1px}
.stat-card .info p{font-size:18px;font-weight:700;color:var(--text);line-height:1.2;letter-spacing:-.3px}

/* ============ MOBILE ============ */
@media(max-width:820px){
  .menu-toggle{display:flex}
  .sidebar{position:fixed;left:-300px;top:0;height:100vh;z-index:300;transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:8px 0 30px rgba(0,0,0,.15);border-radius:0 18px 18px 0;padding-top:18px;width:285px}
  .sidebar.open{left:0}
  .main-content{max-width:100%;padding:13px}
  .topbar{padding:9px 11px}
  .topbar .brand{font-size:14px}
  .topbar .brand .brand-icon{width:33px;height:33px;font-size:14px}
  .back-btn{width:34px;height:34px;font-size:14px}
  .balance-chip{font-size:11.5px;padding:5px 10px}
  .icon-btn{width:34px;height:34px;font-size:14px;padding:7px}
  .stat-card{padding:12px}
  .stat-card .ico{width:40px;height:40px;font-size:16px}
  .stat-card .info p{font-size:16px}
  .field-row{grid-template-columns:1fr}
  .field-builder-row{grid-template-columns:1fr;gap:6px}
  .page-title{font-size:17px}
  .page-title .title-icon{width:36px;height:36px;font-size:15px}
  .card{padding:14px}
  .hero-banner{padding:18px 16px}
  .hero-banner h2{font-size:16px}
  .quick-grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .quick-card{padding:14px}
  .quick-card i{font-size:20px;margin-bottom:7px}
  .quick-card h3{font-size:13px}
  .quick-card p{font-size:11px}
  .auth-box{padding:26px 20px}
  .auth-logo .logo-circle{width:62px;height:62px}
  .auth-logo .logo-circle i{font-size:28px}
  .auth-logo h1{font-size:20px}
  .notice-track{font-size:12.5px}
  .modal{padding:18px;border-radius:14px}
  .menu-item{padding:9px 10px}
  .menu-item .ico{width:36px;height:36px;font-size:14px}
  .menu-item .label .name{font-size:13px}
}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:299}
.sidebar-backdrop.active{display:block}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-circle"><i class="fa-solid fa-landmark"></i></div>
      <h1>ভূমি সেবা পোর্টাল</h1>

let pageHistory = [];  // [{page, extra}]
let isGoingBack = false;

function pushHistory(page, extra){
  // একই পেজ টানা পুশ হবে না
  const last = pageHistory[pageHistory.length-1];
  if(last && last.page===page && last.extra===extra) return;
  pageHistory.push({page, extra});
  // হিস্টোরি বেশি বড় হলে ছোট করুন
  if(pageHistory.length > 50) pageHistory.shift();
  updateBackBtn();
}

function updateBackBtn(){
  const btn = $('backBtn');
  if(!btn) return;
  // হিস্টোরি ১টার বেশি থাকলে back দেখাব
  if(pageHistory.length > 1){
    btn.classList.add('show');
  } else {
    btn.classList.remove('show');
  }
}

window.goBack = () => {
  if(pageHistory.length <= 1){
    // আর কিছু নেই — কিছু করব না
    toast('এটি প্রথম পেজ','error');
    return;
  }
  pageHistory.pop(); // বর্তমান পেজ বাদ
  const prev = pageHistory[pageHistory.length-1];
  isGoingBack = true;
  navigate(prev.page, prev.extra);
  isGoingBack = false;
};

// Android / ব্রাউজার back button
window.addEventListener('popstate', (e)=>{
  if(pageHistory.length > 1){
    e.preventDefault?.();
    goBack();
    // আবার state push করব যাতে পরের back কাজ করে
    history.pushState({appPage:true}, '');
  }
});

async function seedDefaultServices(){
  try{
    const snap = await getDocs(collection(db,'services'));
    if(!snap.empty) return false;
    for(const s of DEFAULT_SERVICES){
      await addDoc(collection(db,'services'), {...s, enabled:true});

    return true;
  }catch(err){ console.error('Seed err:', err); return false; }
}

/* ============ AUTH STATE ============ */
onAuthStateChanged(auth, async user => {
  if(unsubUser){unsubUser();unsubUser=null;}
  if(unsubSettings){unsubSettings();unsubSettings=null;}
  if(unsubServices){unsubServices();unsubServices=null;}

  if(!user){
    currentUser=null;
    pageHistory = [];
    $('authScreen').style.display='flex';
    $('appScreen').classList.remove('active');
    $('waFloat').classList.add('hidden');
    updateBackBtn();
    return;
  }

  const uref = doc(db,'users',user.uid);
  let usnap = await getDoc(uref);

  if(!usnap.exists()){
    const isAdminEmail = (user.email === ADMIN_EMAIL);
    const isSuperAdmin = (user.uid === SUPERADMIN_UID);
    const role = isSuperAdmin ? 'superadmin' : (isAdminEmail ? 'admin' : 'user');
    const phone = user.email.includes('@landbd.local') ? user.email.split('@')[0] : user.email;
    await setDoc(uref, {
      uid: user.uid, name: isAdminEmail ? 'Admin' : 'User', phone,
      balance: 0, role, status:'active', createdAt: serverTimestamp()
    });
    usnap = await getDoc(uref);
  }

  const udata = usnap.data();
  if(user.uid===SUPERADMIN_UID) udata.role='superadmin';
  if(udata.status==='blocked'||udata.status==='removed'){
    await signOut(auth);
    showAuthMsg('আপনার একাউন্ট ব্লক করা হয়েছে');
    return;
  }
  currentUser = {uid:user.uid,...udata};

  const isAdminUser = (currentUser.role==='admin'||currentUser.role==='superadmin');
  if(isAdminUser){
    try{
      const snap = await getDocs(collection(db,'services'));
      if(snap.empty){
        toast('সার্ভিস লোড হচ্ছে...');
        await seedDefaultServices();
        toast('সব সার্ভিস অটো তৈরি হয়েছে!');
      }
    }catch(e){ console.warn(e); }
  }

  unsubUser = onSnapshot(uref, s=>{
    if(!s.exists())return;
    const d = s.data();
    if(d.status==='blocked'||d.status==='removed'){logout();return;}
    currentUser.balance = d.balance||0;
    currentUser.name = d.name||'';
    currentUser.phone = d.phone||'';
    currentUser.role = (user.uid===SUPERADMIN_UID)?'superadmin':(d.role||'user');
    $('topBalance').textContent = fmt(currentUser.balance);
  });

  unsubSettings = onSnapshot(doc(db,'settings','site'), s=>{
    settings = s.exists()? s.data():{};
    applySettings();
  });

  unsubServices = onSnapshot(collection(db,'services'), s=>{
    services=[];
    s.forEach(d=>services.push({id:d.id,...d.data()}));
    services.sort((a,b)=>(a.order||0)-(b.order||0));
    renderSidebar();
    const mc = $('mainContent');
    if(mc.querySelector('.hero-banner') && !mc.querySelector('.admin-tabs')){
      if(!mc.querySelector('.page-title')?.textContent.includes('অর্ডার')) renderHome(mc);
    }
    if(adminTab==='services' && isAdminUser) renderAdminTab();
  });

  $('authScreen').style.display='none';
  $('appScreen').classList.add('active');
  $('topBalance').textContent = fmt(currentUser.balance||0);

  $('balanceChip').style.display = isAdminUser ? 'none' : 'flex';
  $('topBrandText').textContent = isAdminUser ? 'অ্যাডমিন প্যানেল' : 'ভূমি সেবা পোর্টাল';

  pageHistory = []; // রিসেট
  if(isAdminUser) {
    pushHistory('admin');
    navigate('admin');
  } else {
    pushHistory('home');
    navigate('home');
  }
});

  const wa = settings.whatsapp || '';

}

/* =====================================================
   ============ NAVIGATION (with History) ==============
   ===================================================== */
function highlightMenu(page, extra){
  document.querySelectorAll('.sidebar .menu-item').forEach(m=>{
    if(page==='service'){
      m.classList.toggle('active', m.dataset.page === 'service-'+extra);
    } else {
      m.classList.toggle('active', m.dataset.page === page);
    }
  });
}

function navigate(page, extra){
  const isAdmin = (currentUser?.role==='admin'||currentUser?.role==='superadmin');
  if(isAdmin && page!=='admin') page='admin';
  if(!isAdmin && page==='admin') page='home';

  highlightMenu(page, extra);

  const mc = $('mainContent');
  if(page==='home') renderHome(mc);
  else if(page==='recharge') renderRecharge(mc);
  else if(page==='orders') renderOrders(mc);
  else if(page==='profile') renderProfile(mc);
  else if(page==='admin') renderAdmin(mc);
  else if(page==='service') renderServiceForm(mc, extra);

  if(window.innerWidth<=820){$('sidebar').classList.remove('open');$('sbBackdrop').classList.remove('active');}
  window.scrollTo({top:0,behavior:'smooth'});
}

/* পাবলিক navTo — হিস্টোরি সহ */
window.navTo = (page, extra) => {
  // Admin ট্যাব পরিবর্তনে হিস্টোরি পুশ না করি
  const isAdmin = (currentUser?.role==='admin'||currentUser?.role==='superadmin');
  if(isAdmin){
    if(page!=='admin') page='admin';
    pageHistory = [{page:'admin'}]; // অ্যাডমিনে হিস্টোরি একটাই
    updateBackBtn();
    navigate('admin');
    return;
  }
  // ইউজার
  if(!isGoingBack) pushHistory(page, extra);
  navigate(page, extra);
};

window.openService = id => {
  const s = services.find(x=>x.id===id);

  if(s.enabled===false) return toast('এই সার্ভিসটি বর্তমানে বন্ধ','error');
  navTo('service',id);
};

window.submitOrder = async e => {
  e.preventDefault();
  const s = currentService;
  if(!s) return;
  const btn = $('orderSubmitBtn');
  if(btn?.disabled) return;

  if((currentUser.balance||0) < Number(s.price)){
    return toast('পর্যাপ্ত ব্যালেন্স নেই। রিচার্জ করুন।','error');
  }

  btnLoad(btn, true, 'অর্ডার হচ্ছে...');
  const fd = new FormData(e.target);
  const data = {};
  (s.fields||[]).forEach((f,i)=>{ data[f.label] = fd.get('f_'+i)||''; });

  try{
    await runTransaction(db, async (transaction) => {
      const uref = doc(db,'users',currentUser.uid);
      const usnap = await transaction.get(uref);
      if(!usnap.exists()) throw new Error('ইউজার পাওয়া যায়নি');
      const bal = usnap.data().balance || 0;
      if(bal < Number(s.price)) throw new Error('পর্যাপ্ত ব্যালেন্স নেই');
      const oref = doc(collection(db,'orders'));
      transaction.set(oref, {
        userId:currentUser.uid, userName:currentUser.name, userPhone:currentUser.phone,
        serviceId:s.id, serviceName:s.name, price:Number(s.price),
        data, status:'pending', createdAt:serverTimestamp()
      });
      transaction.update(uref, { balance: bal - Number(s.price) });
    });

    toast('অর্ডার সফলভাবে সাবমিট হয়েছে!');
    $('mainContent').innerHTML = `
      <div class="card success-panel">
        <div class="check-circle"><i class="fa-solid fa-check"></i></div>
        <h3>অর্ডার সফলভাবে জমা হয়েছে</h3>
        <p>আপনার অর্ডারটি পর্যালোচনার জন্য পাঠানো হয়েছে। অ্যাডমিন অনুমোদন করলে অর্ডার হিস্টোরিতে দেখতে পাবেন।</p>
        <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="navTo('orders')" type="button"><i class="fa-solid fa-list"></i> অর্ডার হিস্টোরি</button>
        </div>
      </div>`;
  }catch(err){
    toast('সমস্যা: '+(err.message||err),'error');
    btnLoad(btn, false);
  }
};

async function loadOrders(tab){
  const box = $('orderContent');
  if(!box) return;
  box.innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>লোড হচ্ছে...</div>';
  try{
    const q = query(collection(db,tab),where('userId','==',currentUser.uid));
    const snap = await getDocs(q);
    const list = [];
    snap.forEach(d=>list.push({id:d.id,...d.data()}));
    list.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    if(!list.length){
      box.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i>কোন রেকর্ড নেই</div>';
      return;
    }
    if(tab==='orders'){
      box.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>সার্ভিস</th><th>মূল্য</th><th>স্ট্যাটাস</th><th>তারিখ</th></tr></thead><tbody>
        ${list.map(o=>`<tr>
          <td><strong>${esc(o.serviceName)}</strong></td>
          <td>৳${fmt(o.price)}</td>
          <td><span class="badge badge-${o.status}">${statusBn(o.status)}</span></td>
          <td>${fmtDate(o.createdAt)}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
    } else {
      box.innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>মেথড</th><th>পরিমাণ</th><th>TrxID</th><th>স্ট্যাটাস</th><th>তারিখ</th></tr></thead><tbody>
        ${list.map(o=>`<tr>
          <td><strong>${o.method==='bkash'?'বিকাশ':'নগদ'}</strong></td>
          <td>৳${fmt(o.amount)}</td>
          <td>${esc(o.txnId)}</td>

          <td>${fmtDate(o.createdAt)}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
    }
  }catch(err){ box.innerHTML = '<div class="empty">লোড ব্যর্থ: '+esc(err.message)+'</div>'; }
}
const statusBn = s => ({pending:'অপেক্ষমাণ',approved:'অনুমোদিত',rejected:'বাতিল'}[s]||s);

window.saveService = async (e, id) => {
  e.preventDefault();
  const btn = $('serviceSaveBtn');
  if(btn?.disabled) return;
  btnLoad(btn,true,'সেভ হচ্ছে...');
  const fields = [];
  document.querySelectorAll('#fieldsBox > div').forEach(d=>{
    const label = d.querySelector('.fld-label').value.trim();
    if(!label) return;
    fields.push({
      label, name:label.toLowerCase().replace(/\s+/g,'_'),
      type:d.querySelector('.fld-type').value,
      required:d.querySelector('.fld-req').value==='1'
    });
  });
  const data = {
    name:$('svName').value.trim(),
    price:Number($('svPrice').value)||0,
    icon:$('svIcon').value.trim()||'file-lines',
    notice:$('svNotice').value.trim(),
    order:Number($('svOrder').value)||0,
    fields, enabled:true
  };
  try{
    if(id) await updateDoc(doc(db,'services',id),data);
    else await addDoc(collection(db,'services'),data);
    toast('সার্ভিস সেভ হয়েছে');
    closeModal();
  }catch(err){ toast(err.message,'error'); btnLoad(btn,false); }
};

window.approveRecharge = async (rid,uid,amt,btn) => {
  if(btn?.disabled) return;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    await runTransaction(db, async (transaction) => {
      const uref = doc(db,'users',uid);
      const rref = doc(db,'recharges',rid);
      const usnap = await transaction.get(uref);
      const rsnap = await transaction.get(rref);
      if(!usnap.exists()) throw new Error('ইউজার পাওয়া যায়নি');
      if(rsnap.exists() && rsnap.data().status !== 'pending') throw new Error('ইতিমধ্যে প্রসেস হয়েছে');
      const bal = usnap.data().balance || 0;
      transaction.update(uref, { balance: bal + Number(amt) });
      transaction.update(rref, { status:'approved', approvedAt: serverTimestamp() });
    });
    toast('রিচার্জ অনুমোদিত');
    renderAdminTab();
  }catch(err){
    toast(err.message,'error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i>'; }
  }
};

window.rejectOrder = async (id,btn) => {
  if(btn?.disabled) return;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    await runTransaction(db, async (transaction) => {
      const oref = doc(db,'orders',id);
      const osnap = await transaction.get(oref);
      if(!osnap.exists()) throw new Error('অর্ডার পাওয়া যায়নি');
      const d = osnap.data();
      if(d.status !== 'pending') throw new Error('ইতিমধ্যে প্রসেস হয়েছে');
      if(d.userId && d.price){
        const uref = doc(db,'users',d.userId);

        if(usnap.exists()){
          const bal = usnap.data().balance || 0;
          transaction.update(uref, { balance: bal + Number(d.price) });
        }
      }
      transaction.update(oref, { status:'rejected', rejectedAt: serverTimestamp() });
    });
    toast('বাতিল ও রিফান্ড সম্পন্ন');

          <div class="field"><label>নগদ নাম্বার</label><input id="setNg" value="${esc(settings.nagadNumber||'')}" placeholder="01XXXXXXXXX"></div>
          <div class="field"><label>নগদ টাইপ</label><input id="setNgType" value="${esc(settings.nagadType||'Send Money')}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>WhatsApp সাপোর্ট নাম্বার</label><input id="setWa" value="${esc(settings.whatsapp||'')}" placeholder="8801XXXXXXXXX"></div>
          <div class="field"><label>WhatsApp গ্রুপ লিংক</label><input id="setGrp" value="${esc(settings.groupLink||'')}"></div>
        </div>
        <button type="submit" id="settingsBtn" class="btn btn-primary btn-lg"><i class="fa-solid fa-save"></i> সেভ করুন</button>
      </form>
    </div>`;
}
window.saveSettings = async e => {
  e.preventDefault();
  const btn = $('settingsBtn');
  if(btn?.disabled) return;
  btnLoad(btn,true,'সেভ হচ্ছে...');
  const data = {
    mainNotice:$('setNotice').value.trim(),
    bkashNumber:$('setBk').value.trim(),
    bkashType:$('setBkType').value.trim(),
    nagadNumber:$('setNg').value.trim(),
    nagadType:$('setNgType').value.trim(),
    whatsapp:$('setWa').value.trim(),
    groupLink:$('setGrp').value.trim()
  };
  try{
    await setDoc(doc(db,'settings','site'),data,{merge:true});
    toast('সেটিংস সেভ হয়েছে');
  }catch(err){ toast(err.message,'error'); }
  finally{ btnLoad(btn,false); }
};

// প্রথমবার লোড হলে popstate এর জন্য একটা state push
history.pushState({appPage:true}, '');

Object.assign(window, {
  navTo, renderHome, renderRecharge, renderOrders, renderProfile, renderAdmin,
  renderServiceForm, doRegister, doLogin, logout, switchAuth, openService, submitOrder,
  submitRecharge, selectMethod, switchOrderTab, adminJump, switchAdminTab, goBack
});
</script>
